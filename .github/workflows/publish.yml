name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate the package without publishing to npm"
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'JourDePaye/conventions-collectives' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Validate package identity and release version
        id: package
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { appendFileSync, readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(pkg.name, "@jourdepaye/conventions-collectives");
          assert.equal(pkg.private, undefined);
          assert.match(pkg.version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          if (process.env.GITHUB_REF_TYPE === "tag") {
            assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`,
              "The Git tag must match the package.json version");
          }
          const distTag = pkg.version.includes("-") ? "next" : "latest";
          appendFileSync(process.env.GITHUB_OUTPUT,
            `version=${pkg.version}\ndist_tag=${distTag}\n`);
          JS

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Verify the version lock was not changed by compilation
        run: git diff --exit-code -- rules/versions.lock.json

      - name: Create package archive
        run: npm pack --ignore-scripts

      - name: Verify rules can be loaded from the package archive
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/package-smoke"
          tar -xzf "./jourdepaye-conventions-collectives-${PACKAGE_VERSION}.tgz" -C "$RUNNER_TEMP/package-smoke"
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";
          const entry = pathToFileURL(join(process.env.RUNNER_TEMP,
            "package-smoke/package/dist/index.js"));
          const { COMPILED_VERSIONS } = await import(entry.href);
          assert.ok(Object.keys(COMPILED_VERSIONS).length > 0);
          for (const versions of Object.values(COMPILED_VERSIONS)) {
            assert.ok(versions.length > 0);
            for (const version of versions) {
              assert.ok(version.sources.length > 0);
              assert.ok(Object.keys(await version.loadRules()).length > 0);
            }
          }
          JS

      - name: Simulate publication
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          DIST_TAG: ${{ steps.package.outputs.dist_tag }}
        run: npm publish "./jourdepaye-conventions-collectives-${PACKAGE_VERSION}.tgz" --access public --tag "$DIST_TAG" --dry-run

      - name: Publish public package to npm
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          DIST_TAG: ${{ steps.package.outputs.dist_tag }}
          # Optional bootstrap token; subsequent publications can use npm OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "./jourdepaye-conventions-collectives-${PACKAGE_VERSION}.tgz" --access public --tag "$DIST_TAG" --provenance
